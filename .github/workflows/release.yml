name: Release

# Ablauf und Schlüssel: docs/RELEASING.md
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Windows vorerst ohne Release (Marlon, 09.10.2026: im Moment kein Windows im Einsatz). Wieder einschalten:
          # diese drei Zeilen entkommentieren. ci.yml prüft Kern und App unter Windows weiterhin bei jedem Push.
          # - platform: windows-2025
          #   target: x86_64-pc-windows-msvc
          #   args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Liest den Zwischenspeicher, den ci.yml auf main mit demselben Ziel füllt; an der Versionsmarke nicht speichern.
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: app-${{ runner.os }}
          save-if: false
      - run: npm ci
      - name: Vorbelegung der Anmeldung prüfen
        shell: bash
        env:
          A: ${{ vars.SUPABASE_ADRESSE }}
          K: ${{ vars.SUPABASE_ANON_KEY }}
        # Nur ob gesetzt, nie den Wert; als Hinweis sichtbar auch ohne Anmeldung (Annotation).
        run: |
          if [ -n "$A" ] && [ -n "$K" ]; then echo "::notice::Anmeldung vorbelegt (SUPABASE_ADRESSE und SUPABASE_ANON_KEY gesetzt)"
          else echo "::warning::Anmeldung NICHT vorbelegt: Repository-Variablen SUPABASE_ADRESSE/SUPABASE_ANON_KEY fehlen"; exit 0; fi
          # Nimmt der Server den Schlüssel an? Nur Statuscode und die Rolle im Schlüssel, nie der Wert.
          K=$(printf '%s' "$K" | tr -d ' \r\n"'"'"'')
          K=${K#ANON_KEY=}
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${A%/}/auth/v1/settings" -H "apikey: $K" || echo "keine Verbindung")
          ROLLE=$(printf '%s' "$K" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | grep -o '"role":"[a-z_]*"' || echo "nicht lesbar")
          case "$CODE" in
            200) echo "::notice::Server nimmt den Anon-Key an (HTTP 200, Rolle $ROLLE)";;
            403) echo "::notice::Server von GitHub aus nicht prüfbar (HTTP 403, vermutlich Cloudflare); Schlüssel-Rolle $ROLLE";;
            *) echo "::warning::Server lehnt den Anon-Key ab oder ist nicht erreichbar (HTTP $CODE, Rolle $ROLLE). Variable SUPABASE_ANON_KEY prüfen.";;
          esac
      # Mac: mit Developer ID signieren und von Apple beglaubigen, sobald die Geheimnisse eingetragen sind
      # (docs/RELEASING.md). Dann bleibt „Immer erlauben“ im Schlüsselbund über Updates bestehen und Gatekeeper warnt
      # nicht mehr. Ohne Geheimnisse wie bisher ad hoc signiert (tauri.conf.json: signingIdentity "-").
      - name: Apple-Signatur, falls eingerichtet
        if: runner.os == 'macOS'
        shell: bash
        env:
          ZERT: ${{ secrets.APPLE_CERTIFICATE }}
          ZERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ZERT" ] && [ -n "$IDENT" ]; then
            { echo "APPLE_CERTIFICATE<<ENDE"; echo "$ZERT"; echo "ENDE"; } >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$ZERT_PW" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$IDENT" >> "$GITHUB_ENV"
            echo "::notice::Mac wird mit Developer ID signiert"
            if [ -n "$AID" ] && [ -n "$APW" ] && [ -n "$TEAM" ]; then
              { echo "APPLE_ID=$AID"; echo "APPLE_PASSWORD=$APW"; echo "APPLE_TEAM_ID=$TEAM"; } >> "$GITHUB_ENV"
              echo "::notice::und von Apple beglaubigt (Notarisierung)"
            else
              echo "::warning::Ohne APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID: signiert, aber nicht beglaubigt"
            fi
          else
            echo "::notice::Keine Developer ID eingetragen: ad hoc signiert (Schlüsselbund fragt nach jedem Update)"
          fi
      - name: Bauen, signieren, ins Release laden
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Vorbelegung der Anmeldung (Repo → Settings → Variables): nie im Quelltext, nur im gebauten Programm.
          VITE_SUPABASE_ADRESSE: ${{ vars.SUPABASE_ADRESSE }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Der Schlüssel hat kein Passwort. GitHub erlaubt keine leeren Secrets, darum hier fest leer.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Stage Ingest ${{ github.ref_name }}"
          releaseBody: |
            Mac: .dmg öffnen, App nach Programme ziehen. Beim ersten Start Rechtsklick auf die App → Öffnen.
            Windows: Installer ausführen (ohne Administratorrechte).
            Danach kommen Updates automatisch als Banner oben in der App.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  mindestversion:
    # Pflicht-Update: die Datei MINDESTVERSION kommt als Feld mindestVersion in latest.json.
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: mindestVersion in latest.json eintragen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release download "$tag" --pattern latest.json --dir /tmp/r --repo "$GITHUB_REPOSITORY"
          mindest="$(tr -d '[:space:]' < MINDESTVERSION)"
          jq --arg m "$mindest" '. + {mindestVersion: $m}' /tmp/r/latest.json > /tmp/latest.json
          gh release upload "$tag" /tmp/latest.json --clobber --repo "$GITHUB_REPOSITORY"
