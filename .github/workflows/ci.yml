name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kern:
    # Der Kern muss auf allen drei Systemen bestehen: das Lesen ohne Cache ist pro System anders gebaut.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ASC-MHL-Referenz installieren
        shell: bash
        run: |
          pip install ascmhl
          echo "ASCMHL_DEBUG=$(python -c 'import shutil; print(shutil.which("ascmhl-debug"))')" >> "$GITHUB_ENV"
      - name: Kern testen (mit Prüfung gegen die ASC-MHL-Referenz)
        run: cargo test -p ingest-kern
      - name: Clippy
        run: cargo clippy -p ingest-kern --all-targets -- -D warnings

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Oberfläche bauen
        run: npm run build
      - name: App übersetzen
        run: cargo check -p stage-ingest
