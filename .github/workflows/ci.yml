name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ein neuer Push bricht den älteren Lauf desselben Zweigs ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kern:
    # Der Kern muss auf allen drei Systemen bestehen: das Lesen ohne Cache ist pro System anders gebaut.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ASC-MHL-Referenz installieren
        shell: bash
        run: |
          pip install ascmhl
          echo "ASCMHL_DEBUG=$(python -c 'import shutil; print(shutil.which("ascmhl-debug"))')" >> "$GITHUB_ENV"
      - name: Kern testen (mit Prüfung gegen die ASC-MHL-Referenz)
        shell: bash
        # Fehlerzeilen zusätzlich als Annotation, damit sie ohne Anmeldung lesbar sind (Repo ist öffentlich, Logs nicht).
        run: |
          set -o pipefail
          cargo test -p ingest-kern -p ingest-bericht 2>&1 | tee test.log || {
            grep -E "panicked|FAILED|failures:|assert|Error|error" test.log | head -40 | while IFS= read -r z; do echo "::error::$z"; done
            exit 1
          }
      - name: Clippy
        run: cargo clippy -p ingest-kern --all-targets -- -D warnings

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Oberfläche bauen
        run: npm run build
      - name: App übersetzen
        if: github.event_name != 'push'
        run: cargo check -p stage-ingest
      # Auf main: fertige Installer zum Testen (ohne Update-Signatur; signierte Releases macht release.yml).
      - name: Installer bauen
        if: github.event_name == 'push'
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles ${{ matrix.os == 'windows-2025' && 'nsis' || 'dmg' }}
      - name: Installer hochladen
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stage-ingest-${{ matrix.os == 'windows-2025' && 'windows' || 'mac' }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          retention-days: 14
