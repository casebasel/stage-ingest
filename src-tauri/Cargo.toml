[package]
name = "stage-ingest"
description = "Stage Ingest: Kamerakarten geprüft kopieren"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "stage_ingest_lib"
# Nur Desktop: staticlib/cdylib (für iOS/Android) würden bei jedem Release den ganzen Abhängigkeitsbaum zusätzlich linken.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ingest-kern = { path = "../kern" }
ingest-bericht = { path = "../bericht" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = "0.24"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gethostname = "0.5"
# Vorschaubilder (Fotos, HDRI) verkleinern und als data-URL an die Oberfläche geben.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
base64 = "0.22"
walkdir = "2"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# QR-Code der Klappe im Bild lesen (Take-ID `PA:`/`ST:`).
rqrr = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
qrcode = { version = "0.14", default-features = false }

# Passwort des Plate-Assistant-Zugangs im Schlüsselbund des Systems, nie in Dateien.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3" }
